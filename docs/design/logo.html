<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ColomboSync – logo</title>
    <style>
      body {
        margin: 0;
        font-family:
          "Segoe UI Variable Display",
          "Segoe UI Variable Text",
          "Segoe UI",
          system-ui,
          -apple-system,
          "Helvetica Neue",
          Arial,
          sans-serif;
        color: #f5f5f7;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: #5fe0c6;
      }
      a:hover {
        color: #a6f0e1;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 1440px;
        height: 1060px;
        box-sizing: border-box;
        background: #000000;
        padding: 80px;
        display: flex;
        flex-direction: column;
        gap: 56px;
        overflow: hidden;
      "
    >
      <div style="display: flex; flex-direction: column; gap: 14px; max-width: 1000px">
        <p style="margin: 0; font-size: 17px; font-weight: 600; color: #5fe0c6">Logo · tre idee</p>
        <h1 style="margin: 0; font-size: 84px; line-height: 0.98; font-weight: 700; letter-spacing: -0.045em">
          Un colombo di carta.<br /><span style="color: #6e6e73">Porta i tuoi file da A a B.</span>
        </h1>
      </div>

      <div style="display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 24px; flex-grow: 1">
        <section
          style="
            border-radius: 36px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(120% 90% at 50% 15%, #0f3a34 0%, #0a1513 55%, #050707 100%);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
          "
        >
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">1 · Origami</h2>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 48px">
            <div
              style="
                width: 240px;
                height: 240px;
                border-radius: 54px;
                background: linear-gradient(160deg, #3be0c1 0%, #0a7d6e 52%, #05302a 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow:
                  0 0 0 1px rgba(255, 255, 255, 0.14) inset,
                  0 40px 80px -30px rgba(59, 224, 193, 0.55),
                  0 0 120px -20px rgba(59, 224, 193, 0.35);
              "
            >
              <svg viewBox="0 0 100 100" width="176" height="176" role="img" aria-label="Colombo origami">
                <path d="M8 68 L44 57 L37 76 Z" fill="#ffffff" fill-opacity="0.62"></path>
                <path d="M37 76 L44 57 L75 52 L66 71 Z" fill="#ffffff" fill-opacity="0.95"></path>
                <path d="M44 57 L49 21 L61 55 Z" fill="#ffffff" fill-opacity="0.45"></path>
                <path d="M47 59 L72 8 L67 55 Z" fill="#ffffff" fill-opacity="0.82"></path>
                <path d="M67 55 L72 44 L85 36 L80 51 L75 52 Z" fill="#ffffff" fill-opacity="0.7"></path>
                <path d="M85 36 L95 40 L82 43 Z" fill="#ffd27a"></path>
              </svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 22px; align-items: center">
              <div
                style="
                  width: 72px;
                  height: 72px;
                  border-radius: 17px;
                  background: linear-gradient(160deg, #3be0c1 0%, #0a7d6e 52%, #05302a 100%);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14) inset;
                "
              >
                <svg viewBox="0 0 100 100" width="54" height="54" aria-hidden="true">
                  <path d="M8 68 L44 57 L37 76 Z" fill="#fff" fill-opacity="0.62"></path>
                  <path d="M37 76 L44 57 L75 52 L66 71 Z" fill="#fff" fill-opacity="0.95"></path>
                  <path d="M44 57 L49 21 L61 55 Z" fill="#fff" fill-opacity="0.45"></path>
                  <path d="M47 59 L72 8 L67 55 Z" fill="#fff" fill-opacity="0.82"></path>
                  <path d="M67 55 L72 44 L85 36 L80 51 L75 52 Z" fill="#fff" fill-opacity="0.7"></path>
                  <path d="M85 36 L95 40 L82 43 Z" fill="#ffd27a"></path>
                </svg>
              </div>
              <div
                style="
                  width: 32px;
                  height: 32px;
                  border-radius: 8px;
                  background: linear-gradient(160deg, #3be0c1 0%, #0a7d6e 52%, #05302a 100%);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <svg viewBox="0 0 100 100" width="26" height="26" aria-hidden="true">
                  <path d="M8 68 L44 57 L37 76 Z" fill="#fff" fill-opacity="0.7"></path>
                  <path d="M37 76 L44 57 L75 52 L66 71 Z" fill="#fff"></path>
                  <path d="M47 59 L72 8 L67 55 Z" fill="#fff" fill-opacity="0.9"></path>
                  <path d="M67 55 L72 44 L85 36 L80 51 L75 52 Z" fill="#fff" fill-opacity="0.8"></path>
                </svg>
              </div>
              <div
                style="
                  width: 16px;
                  height: 16px;
                  border-radius: 4px;
                  background: #0a7d6e;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                "
              >
                <svg viewBox="0 0 100 100" width="14" height="14" aria-hidden="true">
                  <path d="M37 76 L44 57 L75 52 L66 71 Z" fill="#fff"></path>
                  <path d="M47 59 L72 8 L67 55 Z" fill="#fff"></path>
                </svg>
              </div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 14px">
            <svg viewBox="0 0 100 100" width="44" height="44" aria-hidden="true">
              <path d="M8 68 L44 57 L37 76 Z" fill="#5fe0c6" fill-opacity="0.55"></path>
              <path d="M37 76 L44 57 L75 52 L66 71 Z" fill="#5fe0c6"></path>
              <path d="M44 57 L49 21 L61 55 Z" fill="#5fe0c6" fill-opacity="0.35"></path>
              <path d="M47 59 L72 8 L67 55 Z" fill="#5fe0c6" fill-opacity="0.8"></path>
              <path d="M67 55 L72 44 L85 36 L80 51 L75 52 Z" fill="#5fe0c6" fill-opacity="0.65"></path>
              <path d="M85 36 L95 40 L82 43 Z" fill="#ffd27a"></path>
            </svg>
            <span style="font-size: 34px; letter-spacing: -0.03em; font-weight: 700"
              >Colombo<span style="font-weight: 300; color: #a1a1a6">Sync</span></span
            >
          </div>
        </section>

        <section
          style="
            border-radius: 36px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0b0b0d;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
          "
        >
          <h2 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">2 · Orbita</h2>
          <div style="display: flex; align-items: center; justify-content: center">
            <div
              style="
                width: 200px;
                height: 200px;
                border-radius: 45px;
                background: #111114;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow:
                  0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                  0 30px 70px -30px rgba(122, 92, 255, 0.6);
              "
            >
              <svg
                viewBox="0 0 100 100"
                width="150"
                height="150"
                role="img"
                aria-label="Orbita: un arco di luce da A a B"
              >
                <defs>
                  <linearGradient id="orbG" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#5fe0c6"></stop>
                    <stop offset="0.55" stop-color="#5a8bff"></stop>
                    <stop offset="1" stop-color="#b47cff"></stop>
                  </linearGradient>
                </defs>
                <path
                  d="M20 74 C 20 34, 46 22, 80 28"
                  fill="none"
                  stroke="url(#orbG)"
                  stroke-width="7"
                  stroke-linecap="round"
                ></path>
                <circle cx="20" cy="74" r="8" fill="none" stroke="#5fe0c6" stroke-width="4"></circle>
                <circle cx="80" cy="28" r="10" fill="#b47cff"></circle>
              </svg>
            </div>
          </div>
          <span style="font-size: 30px; letter-spacing: -0.03em; font-weight: 700"
            >Colombo<span style="font-weight: 300; color: #a1a1a6">Sync</span></span
          >
        </section>

        <section
          style="
            border-radius: 36px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #0b0b0d;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
          "
        >
          <div style="display: flex; justify-content: space-between; align-items: center">
            <h2 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">3 · Eclissi</h2>
            <span
              style="
                font-size: 13px;
                font-weight: 700;
                color: #00211b;
                background: linear-gradient(90deg, #6ff0d6, #1fc7a8);
                padding: 5px 12px;
                border-radius: 999px;
              "
              >Scelto</span
            >
          </div>
          <div style="display: flex; align-items: center; justify-content: center">
            <div
              style="
                width: 200px;
                height: 200px;
                border-radius: 45px;
                background: #000000;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow:
                  0 0 0 1px rgba(255, 255, 255, 0.12) inset,
                  0 30px 70px -30px rgba(59, 224, 193, 0.6);
              "
            >
              <svg
                viewBox="0 0 100 100"
                width="150"
                height="150"
                role="img"
                aria-label="Eclissi: A che copre B e lascia una falce di luce"
              >
                <defs>
                  <linearGradient id="eclG" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#6ff0d6"></stop>
                    <stop offset="0.55" stop-color="#1fc7a8"></stop>
                    <stop offset="1" stop-color="#0a7d6e"></stop>
                  </linearGradient>
                </defs>
                <circle cx="58" cy="50" r="28" fill="url(#eclG)"></circle>
                <circle
                  cx="45"
                  cy="50"
                  r="28"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-opacity="0.18"
                  stroke-width="1.5"
                ></circle>
              </svg>
            </div>
          </div>
          <span style="font-size: 30px; letter-spacing: -0.03em; font-weight: 700"
            >Colombo<span style="font-weight: 300; color: #a1a1a6">Sync</span></span
          >
        </section>
      </div>
    </div>
  </body>
</html>
