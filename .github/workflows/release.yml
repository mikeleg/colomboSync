name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-rc.1`) -> tested binaries in a DRAFT GitHub Release.
# Manual run (workflow_dispatch) = dry run: builds and uploads workflow artifacts, creates no release.
# Spec: docs/release-plan.md. Steps: docs/agents/github.md "Releasing".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # origin/main, to check the tag is on it

      # A release must come from main: refuse a tag on a side branch. This checks ancestry only;
      # the release-mode ci.yml run (the build job) is the test gate.
      - name: Tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main: merge first, then tag main"
            exit 1
          fi

      # package.json, tauri.conf.json and Cargo.toml must agree. On a tag, the tag
      # without the "v" must equal that version, or that version plus a pre-release
      # suffix: v0.1.0-rc.1 is accepted while the files say 0.1.0.
      - name: Check versions
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if [ "$pkg" != "$tauri" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::package.json, tauri.conf.json and Cargo.toml have different versions"
            exit 1
          fi
          version=$pkg
          if [ "$REF_TYPE" = "tag" ]; then
            version=${REF_NAME#v}
            if [ "${version%%-*}" != "$pkg" ]; then
              echo "::error::tag $REF_NAME does not match the app version $pkg"
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in 0.* | *-*) prerelease=true ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$prerelease)"

  # Same checks as push CI, then the release files (renamed, universal dmg) as `release-*` artifacts.
  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true
      version: ${{ needs.version.outputs.version }}

  release:
    # Tags only: a manual run stops after the builds.
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the notes

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Checksums
        working-directory: release-files
        run: |
          sha256sum ColomboSync-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Commits since the previous v* tag (all history for the first tag), feat and fix only.
      # A final release (no "-" in the tag) skips the rc tags, so its notes cover everything
      # since the previous final release.
      - name: Release notes
        run: |
          exclude=()
          case "$TAG" in *-*) ;; *) exclude=(--exclude '*-*') ;; esac
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${exclude[@]}" "$TAG^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${prev:+$prev..}$TAG" > commits.txt
          {
            echo "## Novità"
            grep -E '^- feat(\([^)]*\))?!?:' commits.txt || echo "- nessuna"
            echo
            echo "## Correzioni"
            grep -E '^- fix(\([^)]*\))?!?:' commits.txt || echo "- nessuna"
            echo
            cat .github/release-notes-it.md
          } > notes.md
          cat notes.md

      - name: Draft release
        run: |
          flags=(--draft)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # Re-running a failed run must not die on "release already exists".
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Only a draft may be overwritten: never touch a published release.
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published; bump the version and tag again."
              exit 1
            fi
            gh release upload "$TAG" --clobber release-files/*
            gh release edit "$TAG" --draft --prerelease="$PRERELEASE" \
              --title "ColomboSync $VERSION" \
              --notes-file notes.md
          else
            gh release create "$TAG" "${flags[@]}" \
              --title "ColomboSync $VERSION" \
              --notes-file notes.md \
              release-files/*
          fi
