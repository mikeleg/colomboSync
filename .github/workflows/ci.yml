name: CI

on:
  push:
    branches: [main, "slice/**"]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow uses this as its test gate

jobs:
  build:
    # The check names stay "windows", "macos" and "linux".
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # macOS 15 ships openrsync (what the engine targets); macOS 14 ships samba rsync 2.6.9.
          # Explicit label: macos-latest jobs stayed queued with no runner (2026-11-04).
          - name: macos
            os: macos-15
          # GNU rsync 3.4.1, like the fixtures. The release AppImage is built on 22.04
          # (release.yml): it only runs on distros with a glibc at least as new.
          - name: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build # generate_context! needs dist/ before any cargo step

      # Kept on purpose: it documents which rsync the tests below ran against.
      - name: Which rsync
        if: runner.os != 'Windows'
        run: |
          which rsync
          rsync --version

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Windows: the portable exe, no installer.
      - name: Portable exe
        if: runner.os == 'Windows'
        run: npm run portable

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: colombo-sync-windows
          path: src-tauri/target/release/colombo-sync.exe

      # macOS: ad-hoc signed (`bundle.macOS.signingIdentity` is "-"), not notarized.
      - name: App and dmg
        if: runner.os == 'macOS'
        run: |
          npx tauri build --bundles app,dmg
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent ColomboSync.app ColomboSync-macos.zip

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: colombo-sync-macos
          path: |
            src-tauri/target/release/bundle/macos/ColomboSync-macos.zip
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the runner
        run: npx tauri build --bundles appimage

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: colombo-sync-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage
