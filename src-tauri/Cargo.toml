[package]
name = "colombo-sync"
version = "0.1.0"
description = "ColomboSync"
authors = ["MG Soluzioni"]
edition = "2024"

[lib]
# The `_lib` suffix is needed to make the lib name unique and not conflict with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "colombo_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
