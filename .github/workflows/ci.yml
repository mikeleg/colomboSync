name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # More platforms later: add a `strategy.matrix` with `os` and use `runs-on: ${{ matrix.os }}`.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build # generate_context! needs dist/ before any cargo step

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - run: npm run portable

      - uses: actions/upload-artifact@v4
        with:
          name: colombo-sync-windows
          path: src-tauri/target/release/colombo-sync.exe
