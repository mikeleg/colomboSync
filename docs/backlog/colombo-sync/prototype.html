<title>ColomboSync</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one soft "window" with the working screen on the left and a live A→B picture on the right; everything rounded, roomy, reassuring. */
:root{
  --bg:#e9efec;
  --surface:#f6f9f7;
  --card:#ffffff;
  --card-2:#eef3f0;
  --card-3:#e2eae6;
  --fg:#182320;
  --fg-2:#4f5b57;
  --line:rgb(24 35 32 / .10);
  --accent:#1d7a68;
  --on-accent:#ffffff;
  --accent-soft:#d5eee6;
  --on-accent-soft:#0c3a31;
  --ok:#2e7d46;
  --ok-soft:#d8f0dc;
  --on-ok-soft:#0e3a1a;
  --danger:#b5412f;
  --danger-soft:#fde1db;
  --on-danger-soft:#4a1108;
  --warn:#8a5a00;
  --warn-soft:#fbe9bf;
  --on-warn-soft:#3a2600;
  --focus:#1f5fa8;
  --knob:#ffffff;
  --scrim:rgb(12 24 20 / .45);
  --shadow:0 1px 2px rgb(24 35 32 / .05),0 10px 30px -14px rgb(24 35 32 / .22);
  --shadow-win:0 2px 4px rgb(24 35 32 / .05),0 24px 60px -28px rgb(24 35 32 / .35);
  --r:22px;
  --r-s:14px;
  --font:"Nunito","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1311;
    --surface:#111917;
    --card:#1a2420;
    --card-2:#151f1b;
    --card-3:#243029;
    --fg:#e5ece8;
    --fg-2:#aab8b1;
    --line:rgb(229 236 232 / .12);
    --accent:#7fd3bf;
    --on-accent:#06362c;
    --accent-soft:#1d4a40;
    --on-accent-soft:#cdf2e6;
    --ok:#8fd69a;
    --ok-soft:#1c4a28;
    --on-ok-soft:#d5f4da;
    --danger:#ffb3a5;
    --danger-soft:#6b2316;
    --on-danger-soft:#ffdcd5;
    --warn:#f0c46a;
    --warn-soft:#5a4100;
    --on-warn-soft:#ffe6b0;
    --focus:#9ecaff;
    --knob:#ffffff;
    --scrim:rgb(0 6 4 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px -14px rgb(0 0 0 / .6);
    --shadow-win:0 2px 4px rgb(0 0 0 / .3),0 24px 60px -28px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1311;
  --surface:#111917;
  --card:#1a2420;
  --card-2:#151f1b;
  --card-3:#243029;
  --fg:#e5ece8;
  --fg-2:#aab8b1;
  --line:rgb(229 236 232 / .12);
  --accent:#7fd3bf;
  --on-accent:#06362c;
  --accent-soft:#1d4a40;
  --on-accent-soft:#cdf2e6;
  --ok:#8fd69a;
  --ok-soft:#1c4a28;
  --on-ok-soft:#d5f4da;
  --danger:#ffb3a5;
  --danger-soft:#6b2316;
  --on-danger-soft:#ffdcd5;
  --warn:#f0c46a;
  --warn-soft:#5a4100;
  --on-warn-soft:#ffe6b0;
  --focus:#9ecaff;
  --knob:#ffffff;
  --scrim:rgb(0 6 4 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 10px 30px -14px rgb(0 0 0 / .6);
  --shadow-win:0 2px 4px rgb(0 0 0 / .3),0 24px 60px -28px rgb(0 0 0 / .7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 var(--font);font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
#h:focus{outline:none}
.num{font-variant-numeric:tabular-nums}

.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.win{max-width:1040px;margin:0 auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-win);overflow:hidden}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:16px 22px 14px 26px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand .logo{width:40px;height:40px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand .logo svg{width:22px;height:22px}
.brand .t{font-size:19px;font-weight:800;letter-spacing:-.01em}
.brand .s{font-size:14px;color:var(--fg-2);display:block;line-height:1.2}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--card-2);gap:2px}
.seg button{border:0;background:none;border-radius:999px;min-height:36px;padding:0 14px;font-size:14px;font-weight:700;color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:16px;height:16px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.proto{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:13.5px;font-weight:700;color:var(--on-warn-soft);background:var(--warn-soft)}
.proto::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}

.body{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;padding:6px 18px 18px;min-height:640px}
.screen{padding:22px 26px 28px;min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.schema{background:var(--card-2);border-radius:var(--r);padding:20px;min-width:0;align-self:start;position:sticky;top:16px}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 24px;border:0;border-radius:var(--r-s);background:var(--card-3);color:var(--fg);font-size:17px;font-weight:700;cursor:pointer}
.btn:not(:disabled):hover{background:color-mix(in srgb,var(--fg) 8%,var(--card-3))}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.primary:not(:disabled):hover{background:color-mix(in srgb,var(--on-accent) 10%,var(--accent))}
.btn.danger{background:var(--danger);color:var(--card)}
.btn.danger:not(:disabled):hover{background:color-mix(in srgb,var(--fg) 10%,var(--danger))}
.btn.big{min-height:58px;font-size:19px;padding-inline:32px;border-radius:18px}
.btn.small{min-height:38px;font-size:14.5px;padding:4px 14px;background:var(--card);color:var(--accent);border-radius:999px}
.btn.small:not(:disabled):hover{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.btn:disabled{background:color-mix(in srgb,var(--fg) 10%,transparent);color:color-mix(in srgb,var(--fg) 40%,transparent);cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;border-radius:999px;padding:6px 16px;min-height:44px;color:var(--accent);font-weight:700;cursor:pointer}
.link:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:800;white-space:nowrap;line-height:1.4}
.chip.ok{background:var(--ok-soft);color:var(--on-ok-soft)}
.chip.err,.chip.mirror{background:var(--danger-soft);color:var(--on-danger-soft)}
.chip.copy{background:var(--accent-soft);color:var(--on-accent-soft)}
.chip.ann{background:var(--warn-soft);color:var(--on-warn-soft)}
.chip.ok::before{content:"\2713";content:"\2713" / ""}
.chip.err::before{content:"\2715";content:"\2715" / ""}

/* text */
.kicker{font-size:14px;color:var(--fg-2);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
h1{font-size:30px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin:4px 0 8px}
h2{font-size:21px;line-height:1.3;font-weight:800}
.lead{font-size:17.5px;margin-bottom:22px;color:var(--fg-2);max-width:60ch}
.muted{color:var(--fg-2)}
.err-msg{background:var(--danger-soft);color:var(--on-danger-soft);font-weight:700;margin-top:12px;padding:12px 16px;border-radius:var(--r-s)}
.err-msg:empty{display:none}
.err-msg::before{content:"Attenzione: ";}

/* tabs */
.tabs{display:inline-flex;gap:4px;margin-bottom:22px;padding:4px;border-radius:999px;background:var(--card-2)}
.tabs button{background:none;border:0;border-radius:999px;padding:8px 20px;min-height:44px;font-weight:700;color:var(--fg-2);cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}

/* cards */
.list{display:grid;gap:14px;margin-bottom:18px;padding:0;list-style:none}
.card{border-radius:var(--r);padding:20px 22px;background:var(--card-2);color:var(--fg);cursor:pointer;min-width:0;border:2px solid transparent}
.card:hover{background:color-mix(in srgb,var(--fg) 4%,var(--card-2))}
.card.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card-2))}
.card .head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.card .head h2{min-width:0;overflow-wrap:anywhere;flex:1}
.card .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--fg-2);overflow-wrap:anywhere;margin-bottom:16px;font-size:15.5px;font-weight:600}
.card .route svg{width:18px;height:18px;color:var(--accent);flex:none}
.card .route .ar{color:var(--fg-2);opacity:.6}
.card .foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.card .last{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0;font-size:15.5px;color:var(--fg-2)}
.newcard{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:var(--r);background:none;color:var(--accent);font-size:18px;font-weight:800;cursor:pointer}
.newcard:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);border-style:solid}
.newcard svg{width:22px;height:22px}

/* stepper */
.steps{display:flex;gap:4px;list-style:none;padding:0;margin:0 0 24px;flex-wrap:wrap;align-items:center}
.steps li{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;color:var(--fg-2);font-weight:700;font-size:14.5px}
.steps .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card-3);color:var(--fg-2);font-size:14px;font-weight:800}
.steps .n svg{width:16px;height:16px}
.steps li.done{color:var(--fg)}
.steps li.done .n{background:var(--ok-soft);color:var(--on-ok-soft)}
.steps li.cur{background:var(--accent-soft);color:var(--on-accent-soft)}
.steps li.cur .n{background:var(--accent);color:var(--on-accent)}

/* forms / picker */
.f{display:block;font-weight:700;margin-bottom:8px}
input[type=text]{width:100%;min-height:56px;padding:8px 18px;border:2px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--fg);font-size:18px;font-weight:600}
input[type=text]::placeholder{color:var(--fg-2);opacity:.7;font-weight:500}
input[type=text]:hover{border-color:color-mix(in srgb,var(--fg) 25%,transparent)}
input[type=text]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
input[aria-invalid="true"],input[aria-invalid="true"]:focus{border-color:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.help{color:var(--fg-2);font-size:15px;margin-top:8px}
.pick{margin-top:18px;border-radius:var(--r);overflow:hidden;background:var(--card-2)}
.pickhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:12px 18px;overflow-wrap:anywhere;font-size:15px;color:var(--fg-2)}
.pickhead b{color:var(--fg)}
.pickhead>span{min-width:0}
.rows{display:grid;gap:6px;padding:0 10px 10px;max-height:300px;overflow:auto}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 14px;border:0;border-radius:var(--r-s);background:var(--card);text-align:left;cursor:pointer;font-size:17px;font-weight:600}
.row:hover{background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.row svg{width:26px;height:26px;flex:none;color:var(--accent)}
.row span{min-width:0;overflow-wrap:anywhere}
.rows p{padding:14px}
.nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-top:30px}

/* options */
.callout{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:var(--r);background:var(--ok-soft);color:var(--on-ok-soft);font-weight:600;margin-bottom:18px;font-size:17.5px}
.callout::before{content:"\2713";content:"\2713" / "";flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--card);font-weight:800}
details.adv{border-radius:var(--r);background:var(--card-2)}
details.adv>summary{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-height:58px;padding:8px 20px;font-weight:700;cursor:pointer;border-radius:var(--r);list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--fg-2);border-bottom:2.5px solid var(--fg-2);transform:rotate(-45deg);margin-right:4px;transition:transform .15s}
details.adv[open]>summary::before{transform:rotate(45deg)}
details.adv>summary:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
details.adv .advbody{padding:4px 20px 20px}
.sw{display:flex;align-items:center;gap:14px;min-height:52px;cursor:pointer;font-weight:700}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:58px;height:34px;border-radius:999px;background:var(--card-3);position:relative;margin:0;cursor:pointer;border:2px solid var(--line)}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgb(0 0 0/.3);transition:left .15s}
.sw input:checked{background:var(--danger);border-color:var(--danger)}
.sw input:checked::after{left:27px}
.warnbox{display:flex;gap:16px;margin-top:16px;padding:20px;border-radius:var(--r);background:var(--danger-soft);color:var(--on-danger-soft)}
.warnbox svg{width:52px;height:52px;padding:12px;border-radius:50%;background:var(--danger);color:var(--card);flex:none}
.warnbox h3{font-size:20px;font-weight:800;margin-bottom:6px}
.warnbox p+p{margin-top:8px}
.warnbox>div{min-width:0}

/* preview */
.scan{display:flex;gap:16px;align-items:center;padding:26px;border-radius:var(--r);background:var(--card-2);font-size:18px;font-weight:600}
.spin{width:30px;height:30px;border:4px solid var(--card-3);border-top-color:var(--accent);border-radius:50%;flex:none}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot 1s linear infinite}}
@keyframes rot{to{transform:rotate(360deg)}}
.sum{font-size:18px;margin-bottom:16px;line-height:1.5}
.sum b{color:var(--accent)}
.grp{border-radius:var(--r);margin-bottom:12px;background:var(--card-2)}
.grp>summary{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:58px;padding:8px 20px;font-weight:700;cursor:pointer;border-radius:var(--r);list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.grp>summary b{font-size:22px;font-weight:800;padding:0 12px;border-radius:999px;background:var(--card)}
.grp.del{background:var(--danger-soft);color:var(--on-danger-soft)}
.grp.del>summary b{background:var(--danger);color:var(--card)}
.grp.del>summary:hover{background:color-mix(in srgb,var(--on-danger-soft) 8%,transparent)}
.grp .why{padding:0 20px;color:var(--fg-2);font-size:15px}
.grp.del .why{color:var(--on-danger-soft)}
.files{margin:10px 0 0;padding:0 20px 16px 40px;font-family:var(--mono);font-size:14.5px;overflow-wrap:anywhere}
.more{padding:0 20px 14px;color:var(--fg-2);font-size:15px}
.grp.del .more{color:var(--on-danger-soft)}
.empty{text-align:center;padding:36px 16px;background:var(--ok-soft);color:var(--on-ok-soft);border-radius:var(--r);margin-bottom:12px}
.empty svg{width:60px;height:60px;color:var(--ok)}
.empty h2{font-size:24px;margin:8px 0 4px}
.ack{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-radius:var(--r);background:var(--danger-soft);color:var(--on-danger-soft);margin:14px 0;cursor:pointer;font-weight:700}
.ack:hover{background:color-mix(in srgb,var(--on-danger-soft) 8%,var(--danger-soft))}
.ack input{width:28px;height:28px;flex:none;accent-color:var(--danger);margin:0}
.tech{margin-top:14px;color:var(--fg-2)}
.tech summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:700}
.tech code{display:block;padding:14px 16px;border-radius:var(--r-s);background:var(--card-2);color:var(--fg);font:14px/1.5 var(--mono);overflow-wrap:anywhere}
.final{margin-top:24px;padding:22px;border-radius:var(--r);background:var(--card-2)}
.final h2{font-size:24px;margin-bottom:14px}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* run / result */
.curfile{font-family:var(--mono);font-size:15px;color:var(--fg-2);overflow-wrap:anywhere;margin:0 0 22px;min-height:24px;padding:12px 16px;border-radius:var(--r-s);background:var(--card-2)}
.res{display:flex;gap:18px;align-items:flex-start;padding:24px;border-radius:var(--r);background:var(--ok-soft);color:var(--on-ok-soft);margin-bottom:22px}
.res.err{background:var(--danger-soft);color:var(--on-danger-soft)}
.res.ann{background:var(--warn-soft);color:var(--on-warn-soft)}
.res svg{width:56px;height:56px;flex:none;color:var(--ok)}
.res.err svg{color:var(--danger)}
.res.ann svg{color:var(--warn)}
.res>div{min-width:0}
.res h1{font-size:25px;margin-top:0}
.confirm{padding:20px 22px;background:var(--warn-soft);color:var(--on-warn-soft);border-radius:var(--r)}
.confirm p{font-weight:700;margin-bottom:12px}

/* history */
.runs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.run{background:var(--card-2);border-radius:var(--r);padding:18px 22px;min-width:0}
.run .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:10px}
.run .top strong{min-width:0;overflow-wrap:anywhere;font-weight:800;font-size:17.5px}
.run .when{color:var(--fg-2);font-size:15px}
.run .chips{display:flex;gap:8px;margin-left:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;align-items:center}
.stats div{min-width:0}
.stats dt{display:inline;color:var(--fg-2);font-size:15px}
.stats dt::after{content:" "}
.stats dd{display:inline;margin:0;font-weight:800}
.stats .d dd{color:var(--danger)}
.stats .lg{margin-left:auto}

/* schema */
.schema h2{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-2);margin-bottom:14px}
.node{border-radius:var(--r);background:var(--card);color:var(--fg);padding:14px 16px;box-shadow:var(--shadow)}
.node .tag{font-weight:800;font-size:13px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.node .nb{display:flex;gap:12px;align-items:center}
.node .nb>svg{width:48px;height:48px;padding:11px;border-radius:14px;flex:none;background:var(--accent-soft);color:var(--on-accent-soft)}
.node .nb>div{min-width:0}
.node .dl{font-size:14px;color:var(--fg-2);font-weight:600}
.node .pth{font-weight:800;overflow-wrap:anywhere;line-height:1.3}
.node.empty-n{background:var(--card-3);box-shadow:none;border:2px dashed var(--line)}
.node.empty-n .pth{color:var(--fg-2);font-weight:600;font-style:italic}
.node.empty-n .nb>svg{background:var(--card-2);color:var(--fg-2)}
.node.mir{background:var(--danger-soft);color:var(--on-danger-soft)}
.node.mir .dl,.node.mir .tag{color:var(--on-danger-soft)}
.node.mir .nb>svg{background:var(--danger);color:var(--card)}

function logFor(e){
  const dash='-'.repeat(79),L=[];
  L.push(dash,'   ROBOCOPY     ::     Copia file robusta per Windows',dash,'','  Avvio : '+e.when,'  Origine : '+e.a+'\\','  Destinazione : '+e.b+'\\','','  File : *.*','','  Opzioni : *.* '+(e.mirror?'/MIR':'/E')+' /DCOPY:DA /COPY:DAT /R:1 /W:1','',dash,'');
  names('new',e.n,6).forEach((f,i)=>L.push('\t    Nuovo file\t\t   '+(8.7+i*.3).toFixed(1).replace('.',',')+' m\t'+f));

function schemaModel(){
  const v=S.view,w=S.wiz;
  let m={a:'',b:'',mirror:false,counts:null,running:false,prog:null,cap:'',tone:''};
  if(v==='home'||v==='history'){
    const s=sync(S.homeSel)||S.syncs[0];
    if(s){m.a=s.a;m.b=s.b;m.mirror=s.mirror;m.cap='Premi "Controlla e avvia": prima ti mostro cosa cambierà, poi decidi tu.';}else m.cap='Crea una sincronizzazione per vedere lo schema.';
  }else if(v==='wizard'){
    m.a=w.a.trim();m.b=w.b.trim();m.mirror=w.mirror;
    const p=w.step===5&&!w.scanning?w.preview:null;
    if(p){m.counts=p;m.cap=p.n+p.u+p.d===0?'B è già aggiornato.':'Da fare: copiare '+fmtN(p.n)+' file nuovi, aggiornarne '+fmtN(p.u)+(w.mirror?', cancellarne '+fmtN(p.d)+' da B':'')+'.';}
    else if(w.step===5&&w.scanning)m.cap='Sto controllando le due cartelle…';
    else if(!m.a)m.cap='Scegli la cartella da copiare.';
    else if(!m.b)m.cap='Ora scegli dove mettere la copia.';
    else m.cap=w.mirror?'SPECCHIO: B diventerà identico ad A. I file che ci sono solo in B verranno cancellati.':'I file nuovi e modificati di A verranno copiati in B. In B non cancello niente.';
    if(w.mirror&&m.a&&m.b&&!p)m.tone='mir';
  }else if(v==='running'){
    const r=S.run,f=r.done/r.total;
    m.a=r.sync.a;m.b=r.sync.b;m.mirror=r.sync.mirror;m.running=true;
    m.counts={n:Math.round(r.p.n*f),u:Math.round(r.p.u*f),d:Math.round(r.p.d*f)};
    m.prog={done:Math.floor(r.done),total:r.total};
    m.cap='Sto copiando… '+fmtN(m.prog.done)+' di '+fmtN(r.total)+' file';
  }else if(v==='result'){
    const e=S.result.entry;

    m.cap=e.esito==='ok'?'Fatto.':e.esito==='err'?'Non completato.':'Annullato.';
  }
  if(m.mirror&&!m.tone&&(v==='wizard'||v==='running'))m.tone='mir';
  return m;

  $('#schema').innerHTML='<h2>Cosa succede</h2>'+node('A · Da copiare',m.a,false)+
    '<div class="mid'+(m.mirror?' mir':'')+(m.running?' run':'')+'"><div class="arr">'+arrow+'<span class="chip '+(m.mirror?'mirror':'copy')+'">'+(m.mirror?'Specchio':'Copia')+'</span></div>'+
    '<div class="counts"><div class="cnt"><b>'+val('n')+'</b><span>Nuovi</span></div><div class="cnt"><b>'+val('u')+'</b><span>Aggiornati</span></div>'+(m.mirror?'<div class="cnt d"><b>'+val('d')+'</b><span>Eliminati da B</span></div>':'')+'</div></div>'+
    node('B · Copia',m.b,m.mirror)+
    (!m.mirror&&m.a&&m.b?'<p class="safe">'+ICON.tick+'Nessun file viene cancellato in B</p>':'')+
    (m.prog?'<div class="prog"><div class="bar" role="progressbar" aria-label="File copiati" aria-valuemin="0" aria-valuemax="'+m.prog.total+'" aria-valuenow="'+m.prog.done+'"><i style="width:'+(m.prog.done/m.prog.total*100).toFixed(1)+'%"></i></div><small>'+fmtN(m.prog.done)+' di '+fmtN(m.prog.total)+' file</small></div>':'')+
    '<p class="cap'+(m.tone==='mir'?' mir':'')+'">'+esc(m.cap)+'</p>';
}

/* ---------- views ---------- */

const tabs=cur=>'<nav class="tabs" aria-label="Sezioni"><button type="button" data-act="tab" data-v="home"'+(cur==='home'?' aria-current="page"':'')+'>Sincronizzazioni</button><button type="button" data-act="tab" data-v="history"'+(cur==='history'?' aria-current="page"':'')+'>Storico</button></nav>';

    '<p class="route">'+ICON[kind(s.a)]+'<span>'+esc(s.a)+'</span><span class="ar">&rarr;</span>'+ICON[kind(s.b)]+'<span>'+esc(s.b)+'</span></p>'+note+'<div class="foot"><div class="last">'+(l?'<span>Ultima volta: <span class="num">'+l.when+'</span></span>'+chipOut(l.esito):'<span>Mai avviata</span>')+'</div>'+

function viewHistory(){
  return tabs('history')+'<h1 id="h" tabindex="-1">Storico</h1><p class="lead">Tutte le copie fatte, dalla più recente. Ogni riga ha il suo registro completo.</p><ul class="runs">'+S.history.map(e=>

const STEPS=['Da dove','Dove','Nome','Opzioni','Anteprima'];
const TITLES=['Da dove copio?','Dove copio?','Come la chiamo?','Opzioni','Anteprima'];
function stepper(step){
  return '<ol class="steps" aria-label="Passi">'+STEPS.map((s,i)=>{const n=i+1,c=n<step?'done':n===step?'cur':'';
    return '<li class="'+c+'"'+(n===step?' aria-current="step"':'')+'><span class="n">'+(n<step?ICON.tick:n)+'</span><span class="lbl">'+s+'</span></li>';}).join('')+'</ol>';
}
function listHTML(path){
  const loc=isPath(path)?key(path):'';
  const row=(p,ic,t)=>'<button type="button" class="row" data-act="pick" data-path="'+esc(p)+'">'+ic+'<span>'+esc(t)+'</span></button>';
  const items=loc===''?DRIVES.map(d=>row(d[0],ICON[kind(d[0])],d[1]+'  '+d[2])):kids(loc).map(n=>row(join(loc,n),ICON.folder,n));
  return '<div class="pickhead'+(loc?' chosen':'')+'" id="pickHead" tabindex="-1"><span>'+(loc===''?'Dischi del computer: scegline uno':ICON.tick+'Cartella scelta: <b>'+esc(loc)+'</b>')+'</span>'+(loc?'<button type="button" class="btn small" data-act="pick" data-path="'+esc(parent(loc))+'">'+ICON.up+' Livello superiore</button>':'')+'</div><div class="rows">'+(items.join('')||'<p class="muted">Qui dentro non ci sono altre cartelle.</p>')+'</div>';
}
function picker(which){
  const w=S.wiz,v=w[which],isA=which==='a';
  return '<p class="f">'+(isA?'Clicca sulla cartella da copiare (A)':'Clicca sulla cartella dove mettere la copia (B)')+'</p>'+
  '<p class="help" style="margin:0 0 10px">Ogni clic entra nella cartella e la sceglie. Quando sei in quella giusta, premi Avanti.</p>'+
  '<div class="pick" id="pickList">'+listHTML(v)+'</div>'+
  '<div class="err-msg" id="err" role="alert"></div>'+
  '<details class="manual"><summary>Preferisci scrivere il percorso a mano?</summary><div class="manualbody"><label class="f" for="path-'+which+'">Percorso</label>'+
  '<input type="text" id="path-'+which+'" value="'+esc(v)+'" placeholder="Per esempio: '+(isA?'D:\\Foto':'E:\\Backup')+'" autocomplete="off" spellcheck="false">'+
  '<p class="help">Per esempio D:\\Foto oppure \\\\NAS\\Condivisa. Premi Invio per andare avanti.</p></div></details>';
}
function wizFooter(){
  const w=S.wiz;
  if(w.step===5&&!w.scanning)return '';
  return '<div class="nav"><button type="button" class="btn" data-act="back">'+(w.step===1||w.savedId?'Annulla':'Indietro')+'</button>'+(w.step<5?'<button type="button" class="btn primary" data-act="next">Avanti</button>':'')+'</div>';
}
function warnHTML(on){
  return on?'<div class="warnbox" role="alert">'+ICON.warn+'<div><h3>Attenzione: questa opzione cancella dei file</h3><p>Ogni file che c’è in B ma non in A verrà <b>CANCELLATO</b> da B. Non finisce nel Cestino.</p><p>Usalo solo se B serve esclusivamente come copia di A.</p><p>Prima di partire vedrai l’elenco dei file che verranno cancellati.</p></div></div>':'';
}
function viewWizard(){
  const w=S.wiz,head='<div class="kicker">Passo '+w.step+' di 5</div><h1 id="h" tabindex="-1">'+(w.savedId&&w.step===5?'Anteprima: '+esc(w.name):TITLES[w.step-1])+'</h1>';
  let b='';
  if(w.step===1)b=picker('a');
  else if(w.step===2)b=picker('b');
  else if(w.step===3)b='<label class="f" for="name">Nome della sincronizzazione</label><input type="text" id="name" value="'+esc(w.name)+'" autocomplete="off"><p class="help">Serve solo a riconoscerla nell’elenco. Puoi tenere questo nome o cambiarlo.</p><div class="err-msg" id="err" role="alert"></div>';
  else if(w.step===4)b='<p class="callout">I file nuovi e modificati vengono copiati in B. Non cancello mai niente in B.</p>'+
    '<details class="adv" id="adv"'+(w.advOpen?' open':'')+'><summary>Opzioni avanzate <span id="advChip">'+(w.mirror?'<span class="chip mirror">Specchio attivo</span>':'')+'</span></summary><div class="advbody"><label class="sw" for="mirror"><input type="checkbox" role="switch" id="mirror"'+(w.mirror?' checked':'')+'><span>Rendi B identico ad A (specchio)</span></label><div id="mirrorWarn">'+warnHTML(w.mirror)+'</div></div></details>';
  else b=viewPreview();
  return stepper(w.step)+head+(w.step===5?'':'<div style="height:14px"></div>')+b+wizFooter();
}
function viewPreview(){
  const w=S.wiz,p=w.preview;
  if(w.scanning)return '<div class="scan" role="status"><span class="spin"></span><span>Sto controllando le due cartelle… Non copio ancora niente.</span></div>';
  const total=p.n+p.u+p.d,need=w.mirror&&p.d>0;
  const grp=(t,why,cls,cnt,list)=>cnt>0?'<details class="grp '+cls+'" open><summary><span>'+t+'</span><b class="num">'+fmtN(cnt)+'</b></summary><p class="why">'+why+'</p><ul class="files">'+list.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+(cnt>list.length?'<p class="more">… e altri '+fmtN(cnt-list.length)+' file</p>':'')+'</details>':'';
  const cmd='robocopy "'+esc(w.a.trim())+'" "'+esc(w.b.trim())+'" '+(w.mirror?'/MIR':'/E')+' /R:1 /W:1 /L /NJH /NJS /NDL /NC /BYTES /FP /NP /UNILOG:"%TEMP%\\colombosync-anteprima.log"';
  const tech='<details class="tech"><summary>Dettagli tecnici</summary><code>'+cmd+'</code><p class="help">Per la copia vera si toglie /L.</p></details>';
  if(total===0)return '<div class="empty">'+ICON.check+'<h2>B è già aggiornato</h2><p>Non c’è niente da copiare: B ha già tutto quello che c’è in A.</p></div>'+tech+
    '<div class="final"><div class="btns"><button type="button" class="btn primary" data-act="saveEmpty">'+(w.savedId?'Torna all’elenco':'Salva e chiudi')+'</button>'+(w.savedId?'':'<button type="button" class="link" data-act="back">Indietro</button>')+'</div></div>';
  return '<p class="sum">'+(w.mirror?'Ecco cosa succederà in B':'Ecco cosa verrà fatto')+': <b>'+fmtN(p.n)+'</b> file nuovi, <b>'+fmtN(p.u)+'</b> da aggiornare'+(w.mirror?', <b>'+fmtN(p.d)+'</b> da cancellare':'')+'. Peso totale da copiare: <b>'+fmtSize(p.bytes)+'</b>.</p>'+
    grp('Da copiare (nuovi)','File che ci sono in A e non ci sono ancora in B.','',p.n,p.newList)+
    grp('Da aggiornare','File che in B sono più vecchi di quelli in A.','',p.u,p.updList)+
    (w.mirror?(p.d>0?grp('Da cancellare in B','File che ci sono solo in B. Verranno cancellati e non finiscono nel Cestino.','del',p.d,p.delList):'<p class="sum">In B non ci sono file in più: non verrà cancellato niente.</p>'):'')+
    (need?'<label class="ack" for="ack"><input type="checkbox" id="ack"'+(w.ack?' checked':'')+'><span>Ho capito: '+fmtN(p.d)+' file verranno cancellati da B</span></label>':'')+
    tech+
    '<section class="final" aria-labelledby="fq"><h2 id="fq">Avviare adesso?</h2><div class="btns"><button type="button" class="btn primary big" id="yes" data-act="yes"'+(need&&!w.ack?' disabled':'')+'>'+ICON.play+'Sì, avvia</button><button type="button" class="btn big" data-act="no">'+(w.savedId?'No, torna all’elenco':'No, salva e basta')+'</button>'+(w.savedId?'':'<button type="button" class="link" data-act="back">Indietro, cambio qualcosa</button>')+'</div></section>';
}

function viewRunning(){
  const r=S.run;
  return '<div class="kicker">In corso</div><h1 id="h" tabindex="-1">Sto copiando <span class="hn">'+esc(r.sync.name)+'</span>…</h1><p class="lead">Non spegnere il computer e non scollegare i dischi finché non ho finito. Puoi fermarti quando vuoi: i file già copiati restano in B.</p>'+
  '<div class="runprog"><div class="rp-top"><b id="rpPct">0%</b><span id="rpTxt">0 di '+fmtN(r.total)+' file</span></div><div class="bar big" role="progressbar" aria-label="Avanzamento della copia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="rpBar"><i style="width:0%"></i></div><p class="rp-eta" id="rpEta">Calcolo il tempo che manca…</p><p class="sr" id="rpLive" aria-live="polite"></p></div><div class="curfile" id="curFile" aria-hidden="true"></div>'+
  (r.confirm?'<div class="confirm" role="alertdialog" aria-labelledby="cq"><p id="cq">Vuoi fermare la copia? I file già copiati restano in B.</p><div class="btns"><button type="button" class="btn danger" data-act="cancelYes">Sì, ferma</button><button type="button" class="btn" id="cancelNo" data-act="cancelNo">No, continua</button></div></div>'
  :'<button type="button" class="btn" id="cancelBtn" data-act="cancelAsk">'+ICON.stop+'Ferma la copia</button>');
}

function viewResult(){
  const e=S.result.entry;
  let cls='',ic=ICON.check,h='',p='';
  if(e.esito==='ok'){
    h='Fatto: '+fmtN(e.n)+' '+(e.n===1?'file copiato':'file copiati')+', '+fmtN(e.u)+' '+(e.u===1?'aggiornato':'aggiornati')+(e.mirror&&e.d>0?', '+fmtN(e.d)+' '+(e.d===1?'cancellato':'cancellati')+' da B':'')+' in '+e.dur;
    p='B ora è aggiornato.';
  }else if(e.esito==='err'){
    cls=' err';ic=ICON.cross;
    const t=isNet(e.b)?e.b:isNet(e.a)?e.a:e.b;
    h='Non completato: '+(isNet(t)?'la cartella di rete ':'il disco ')+netTag(t)+' non è raggiungibile.';
    p='Controlla la connessione e riprova.'+(e.n+e.u>0?' I '+fmtN(e.n+e.u)+' file già copiati restano in B.':'');
  }else{
    cls=' ann';ic=ICON.stop;
    h='Annullato: ho fermato la copia.';

  '<div class="btns">'+(e.esito==='ok'?'<button type="button" class="btn primary big" data-act="home">Torna all’elenco</button>':'<button type="button" class="btn primary big" data-act="retry">Riprova</button><button type="button" class="btn big" data-act="home">Torna all’elenco</button>')+
  '<button type="button" class="link" data-act="log" data-id="'+e.id+'">Apri il registro</button><button type="button" class="link" data-act="tab" data-v="history">Vai allo storico</button></div>';

const VIEWS={home:viewHome,history:viewHistory,wizard:viewWizard,running:viewRunning,result:viewResult};
function render(focus){
  $('#screen').innerHTML=VIEWS[S.view]();
  renderSchema();
  if(S.view==='running')updCur();
  if(focus!==false){const el=$(focus||'#h');if(el)el.focus();}
}

/* ---------- wizard logic ---------- */
function pathErr(which){
  const w=S.wiz,p=w[which].trim();
  if(!p)return which==='a'?'Scegli prima la cartella da copiare.':'Scegli prima dove mettere la copia.';
  if(!isPath(p))return 'Questo non sembra un percorso. Scrivilo così: D:\\Foto oppure \\\\NAS\\Condivisa, oppure sceglilo dall’elenco.';
  if(which==='b'){const A=norm(w.a),B=norm(p);
    if(A===B)return 'La destinazione è la stessa cartella da copiare. Scegline un’altra.';
    if(B.startsWith(A+'\\'))return 'La destinazione non può stare dentro la cartella da copiare.';}
  return '';
}
function showErr(msg,focusSel){
  const el=$('#err'),inp=$(focusSel);
  if(el)el.textContent=msg;
  if(inp){inp.setAttribute('aria-invalid',msg?'true':'false');if(msg){const d=inp.closest('details');if(d)d.open=true;inp.focus();}}
}
function liveErr(which){
  const w=S.wiz;let m='';
  if(which==='b'&&w.b.trim()&&isPath(w.b)){const e=pathErr('b');if(/stare dentro|stessa cartella/.test(e))m=e;}
  const el=$('#err');if(el)el.textContent=m;
  const inp=$('#path-'+which);if(inp)inp.setAttribute('aria-invalid',m?'true':'false');
}
function setPath(p){
  const w=S.wiz,which=w.step===1?'a':'b';
  w[which]=p;
  $('#path-'+which).value=p;
  $('#pickList').innerHTML=listHTML(p);
  liveErr(which);renderSchema();
  const h=$('#pickHead');if(h)h.focus();
}
function next(){
  const w=S.wiz;
  if(w.step===1||w.step===2){
    const which=w.step===1?'a':'b',e=pathErr(which);
    if(e)return showErr(e,'#path-'+which);
    if(w.step===2&&!w.nameTouched)w.name='Copia di '+last(w.a);
  }else if(w.step===3){
    if(!w.name.trim())return showErr('Scrivi un nome per riconoscere questa sincronizzazione.','#name');
  }
  if(w.step===4)return startScan();
  w.step++;render();
}
function back(){
  const w=S.wiz;
  if(w.step===1||w.savedId){S.scanTok++;S.view='home';return render();}
  S.scanTok++;w.step--;w.scanning=false;render();
}
function startScan(){
  const w=S.wiz,tok=++S.scanTok;
  w.step=5;w.preview=null;w.scanning=true;w.ack=false;render();
  setTimeout(()=>{if(tok!==S.scanTok)return;w.scanning=false;w.preview=makePreview(w);render('#h');},1600);
}
function openSaved(id){
  const s=sync(id);
  S.homeSel=id;
  S.wiz=newWiz({savedId:id,a:s.a,b:s.b,name:s.name,nameTouched:true,mirror:s.mirror,seed:s.seed});
  S.view='wizard';startScan();
}
function saveSync(){
  const w=S.wiz;
  if(w.savedId)return sync(w.savedId);
  const s={id:Date.now(),name:w.name.trim(),a:w.a.trim(),b:w.b.trim(),mirror:w.mirror,seed:w.seed,last:null};
  S.syncs.unshift(s);w.savedId=s.id;S.homeSel=s.id;return s;
}

/* ---------- run ---------- */
function updCur(){
  const el=$('#curFile'),r=S.run;
  if(!r)return;
  if(el)el.textContent='Sto copiando: '+genName('new',Math.floor(r.done));
  const pct=Math.min(100,Math.floor(r.done/r.total*100)),done=Math.floor(r.done);
  const p=$('#rpPct'),t=$('#rpTxt'),b=$('#rpBar'),e=$('#rpEta'),l=$('#rpLive');
  if(p)p.textContent=pct+'%';
  if(t)t.textContent=fmtN(done)+' di '+fmtN(r.total)+' file';
  if(b){b.setAttribute('aria-valuenow',pct);b.firstChild.style.width=pct+'%';}
  if(e){const el2=(Date.now()-r.t0)/1000,rate=r.done/Math.max(el2,.1),left=Math.ceil((r.total-r.done)/Math.max(rate,1e-6));e.textContent=el2<1?'Calcolo il tempo che manca…':left<=1?'Quasi finito.':'Mancano circa '+left+' secondi.';}
  if(l&&pct>=r.lastAnn+10){r.lastAnn=pct-pct%10;l.textContent='Copia al '+r.lastAnn+'%';}
}
function startRun(){
  const w=S.wiz,s=saveSync(),p=w.preview;
  S.run={sync:s,p,total:p.n+p.u+p.d,done:0,confirm:false,fail:S.demo.netFail,timer:null,t0:Date.now(),lastAnn:0};
  S.view='running';render();
  S.run.timer=setInterval(tick,100);
}
function tick(){
  const r=S.run;if(!r)return;
  r.done=Math.min(r.total,r.done+r.total/55*(.7+Math.random()*.6));
  if(r.fail&&r.done/r.total>=.45)return finish('err');
  if(r.done>=r.total)return finish('ok');
  renderSchema();updCur();
}
function finish(esito){
  const r=S.run;clearInterval(r.timer);
  const f=esito==='ok'?1:r.done/r.total,c=esito==='ok'?r.p:{n:Math.round(r.p.n*f),u:Math.round(r.p.u*f),d:Math.round(r.p.d*f)};
  const m=Math.round(r.total*f/75),dur=esito==='ok'?Math.max(1,m)+' min':(m<1?'< 1 min':m+' min');
  const e={id:Date.now(),when:nowStr(),name:r.sync.name,mirror:r.sync.mirror,a:r.sync.a,b:r.sync.b,n:c.n,u:c.u,d:c.d,dur,esito};
  S.history.unshift(e);r.sync.last={when:e.when,esito};
  S.result={entry:e};S.run=null;S.view='result';render();
}

/* ---------- modal ---------- */
let lastFocus=null;
function openLog(id){
  const e=S.history.find(x=>String(x.id)===String(id));if(!e)return;
  lastFocus=document.activeElement;
  $('#modal').innerHTML='<div class="overlay" data-act="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">Registro – '+esc(e.name)+' ('+e.when+')</h2><button type="button" class="btn" id="mclose" data-act="closeLog">Chiudi</button></header><pre tabindex="0">'+esc(logFor(e))+'</pre></div></div>';
  $('#app').inert=true;$('#mclose').focus();
}
function closeLog(){
  $('#modal').innerHTML='';$('#app').inert=false;
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}

/* ---------- events ---------- */
const ACT={
  new(){S.wiz=newWiz();S.view='wizard';render();},
  start(el){openSaved(+el.dataset.id);},
  tab(el){S.view=el.dataset.v;render();},
  pick(el){setPath(el.dataset.path);},
  next,back,
  yes(){startRun();},
  no(){if(!S.wiz.savedId)saveSync();S.view='home';render();},
  saveEmpty(){if(!S.wiz.savedId)saveSync();S.view='home';render();},
  home(){S.view='home';render();},
  retry(){openSaved(sync(S.homeSel)?S.homeSel:S.syncs[0].id);},
  cancelAsk(){S.run.confirm=true;render('#cancelNo');},
  cancelNo(){S.run.confirm=false;render('#cancelBtn');},
  cancelYes(){finish('ann');},
  log(el){openLog(el.dataset.id);},
  closeLog,
  overlay(el,e){if(e.target===el)closeLog();},
  theme(el){applyTheme(el.dataset.t);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el){ACT[el.dataset.act]&&ACT[el.dataset.act](el,e);return;}
  const c=e.target.closest('.card');if(c)selCard(+c.dataset.id);
});
document.addEventListener('focusin',e=>{const c=e.target.closest&&e.target.closest('.card');if(c)selCard(+c.dataset.id);});
function selCard(id){
  if(S.view!=='home'||S.homeSel===id)return;
  S.homeSel=id;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',+c.dataset.id===id));
  renderSchema();
}
document.addEventListener('input',e=>{
  const t=e.target,w=S.wiz;
  if(t.id==='path-a'||t.id==='path-b'){w[t.id.slice(-1)]=t.value;const el=$('#err');if(el)el.textContent='';t.setAttribute('aria-invalid','false');renderSchema();}
  else if(t.id==='name'){w.name=t.value;w.nameTouched=true;const el=$('#err');if(el)el.textContent='';t.setAttribute('aria-invalid','false');}
});
document.addEventListener('change',e=>{
  const t=e.target,w=S.wiz;
  if(t.id==='path-a'||t.id==='path-b'){const which=t.id.slice(-1);$('#pickList').innerHTML=listHTML(w[which]);liveErr(which);}
  else if(t.id==='mirror'){
    w.mirror=t.checked;$('#mirrorWarn').innerHTML=warnHTML(w.mirror);
    $('#advChip').innerHTML=w.mirror?'<span class="chip mirror">Specchio attivo</span>':'';renderSchema();
  }
  else if(t.id==='ack'){w.ack=t.checked;$('#yes').disabled=!w.ack;}
  else if(t.id==='demoNet')S.demo.netFail=t.checked;
  else if(t.id==='demoUp')S.demo.upToDate=t.checked;
});
document.addEventListener('toggle',e=>{if(e.target.id==='adv')S.wiz.advOpen=e.target.open;},true);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal').firstChild){closeLog();return;}
  if(e.key==='Enter'&&/^(path-a|path-b|name)$/.test(e.target.id||'')){e.preventDefault();next();}
});

render(false);
})();
</script>
